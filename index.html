<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>MFG Output & Cost Analysis System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js DataLabels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <!-- SheetJS (Excel 匯入匯出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas (圖表匯出 PNG) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Firebase SDK (相容版本) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- 登入 Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
      <h2 class="text-2xl font-bold mb-6 text-center text-slate-700">系統登入</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">電子郵件</label>
          <input type="email" id="auth-email" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">密碼</label>
          <input type="password" id="auth-password" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
        </div>
        <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">登入</button>
        <div id="auth-error" class="text-red-500 text-sm text-center hidden"></div>
      </div>
    </div>
  </div>

  <!-- 主導覽列 -->
  <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <h1 class="text-xl font-bold text-slate-800">MFG 分析系統</h1>
      <span id="user-email-display" class="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full">驗證中...</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="window.exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition">匯出 Excel</button>
      <label class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition cursor-pointer">
        匯入 Excel <input type="file" accept=".xlsx, .xls" class="hidden" onchange="window.importFromExcel(event)">
      </label>
      <button onclick="handleLogout()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-300 transition">登出</button>
    </div>
  </header>

  <!-- 工作表標籤列 -->
  <div class="bg-slate-50 border-b px-6 py-2 flex items-center justify-between overflow-x-auto">
    <div id="sheets-tab-container" class="flex space-x-2 items-center"></div>
    <button onclick="window.addSheet()" class="bg-slate-800 text-white px-3 py-1.5 rounded-md text-xs font-medium hover:bg-slate-700 transition">+ 新增工作表</button>
  </div>

  <!-- 主內容區 -->
  <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap gap-3 items-center justify-between">
      <div class="flex items-center space-x-2">
        <button onclick="window.addRow()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ 新增列</button>
        <button onclick="window.deleteLastRow()" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200 transition">刪除最後一列</button>
        <button onclick="window.addColumn()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ 新增欄</button>
        <button onclick="window.deleteLastColumn()" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200 transition">刪除最後一欄</button>
      </div>
      <span class="text-xs text-slate-400">提示：雙擊工作表標籤可直接修改名稱</span>
    </div>

    <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
      <table id="app-table" class="w-full text-left border-collapse"></table>
    </div>

    <div id="charts-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <script>
    // ==========================================
    // 1. Firebase 初始化與資料防護鎖
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyB7Oss_eMXO4i4PBs9ZziiREb4r9Ko6a74",
      authDomain: "mfgoutput03.firebaseapp.com",
      databaseURL: "https://mfgoutput03-default-rtdb.firebaseio.com",
      projectId: "mfgoutput03",
      storageBucket: "mfgoutput03.firebasestorage.app",
      messagingSenderId: "1024777823009",
      appId: "1:1024777823009:web:cb476e777a3220de671460",
      measurementId: "G-0805TLXWJH"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const defaultState = {
      currentSheetId: 'sheet_1',
      sheets: [
        {
          id: 'sheet_1',
          name: '產值分析',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'month', title: '月份' },
            { key: '2023', title: '2023' },
            { key: '2024', title: '2024' },
            { key: '2025', title: '2025' },
            { key: '2026', title: '2026' }
          ],
          data: []
        },
        {
          id: 'sheet_2',
          name: '線上WIP',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'd1', title: '2026/5/1' },
            { key: 'd2', title: '2026/5/2' },
            { key: 'd3', title: '2026/5/3' }
          ],
          data: [
            { category: '線切割', d1: 9536, d2: 9062, d3: 7805 },
            { category: '金屬一課', d1: 10391, d2: 10792, d3: 9729 },
            { category: '金屬二課', d1: 7344, d2: 7586, d3: 10036 },
            { category: '車床課', d1: 7881, d2: 10905, d3: 7133 },
            { category: '最終檢驗', d1: 8132, d2: 10850, d3: 10797 },
            { category: '表面處理', d1: 8117, d2: 7944, d3: 9589 },
            { category: '後處理', d1: 7666, d2: 7315, d3: 9616 }
          ]
        },
        {
          id: 'sheet_3',
          name: '石墨複合材占比',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'm1', title: 'May-25' },
            { key: 'm2', title: 'Jun-25' },
            { key: 'm3', title: 'Jul-25' },
            { key: 'm4', title: 'Aug-25' },
            { key: 'm5', title: 'Sep-25' }
          ],
          data: [
            { category: '石墨', m1: 8489, m2: 8474, m3: 10623, m4: 10722, m5: 10029 },
            { category: '複材', m1: 10582, m2: 8292, m3: 10028, m4: 9038, m5: 9784 },
            { category: '石墨加複材', m1: 19071, m2: 16766, m3: 20651, m4: 19760, m5: 19813 }
          ]
        }
      ]
    };

    const localCachedState = localStorage.getItem('mfg_app_state_cache');
    window.appState = localCachedState ? JSON.parse(localCachedState) : defaultState;
    window.isAuthorizedEditor = false;
    window.chartInstances = {};
    let isDataLoadedFromCloud = false;

    auth.onAuthStateChanged(user => {
      if (user) {
        window.isAuthorizedEditor = true;
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('user-email-display').textContent = user.email;
        loadFromFirebase();
      } else {
        window.isAuthorizedEditor = false;
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('user-email-display').textContent = '未登入';
        renderApp();
      }
    });

    function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      const errEl = document.getElementById('auth-error');
      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => {
          errEl.textContent = "登入失敗：" + err.message;
          errEl.classList.remove('hidden');
        });
    }

    function handleLogout() {
      auth.signOut();
    }

    function autoSaveToFirebase() {
      if (!window.isAuthorizedEditor) return;
      if (!isDataLoadedFromCloud && window.appState.sheets[0].data.length === 0) return;
      
      localStorage.setItem('mfg_app_state_cache', JSON.stringify(window.appState));
      db.ref('mfg_app_state').set(window.appState);
    }

    function loadFromFirebase() {
      db.ref('mfg_app_state').once('value').then(snapshot => {
        const val = snapshot.val();
        if (val && val.sheets && val.sheets.length > 0 && val.sheets[0].data.length > 0) {
          window.appState = val;
          localStorage.setItem('mfg_app_state_cache', JSON.stringify(window.appState));
        } else if (window.appState.sheets[0].data.length > 0) {
          db.ref('mfg_app_state').set(window.appState);
        }
        isDataLoadedFromCloud = true;
        renderApp();

        db.ref('mfg_app_state').on('value', snap => {
          const liveVal = snap.val();
          if (liveVal && liveVal.sheets && liveVal.sheets.length > 0 && liveVal.sheets[0].data.length > 0) {
            window.appState = liveVal;
            localStorage.setItem('mfg_app_state_cache', JSON.stringify(window.appState));
            renderApp();
          }
        });
      }).catch(err => {
        console.error("載入 Firebase 失敗:", err);
        isDataLoadedFromCloud = true;
        renderApp();
      });
    }

    // ==========================================
    // 2. 核心渲染與工作表操作
    // ==========================================
    window.renderApp = function() {
      renderSheetsTabs();
      renderTable();
      renderCharts();
    }

    function renderSheetsTabs() {
      const container = document.getElementById('sheets-tab-container');
      container.innerHTML = '';
      window.appState.sheets.forEach(sheet => {
        const isActive = sheet.id === window.appState.currentSheetId;
        const tab = document.createElement('div');
        tab.className = `flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border'}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = sheet.name;
        titleSpan.ondblclick = () => {
          if (!window.isAuthorizedEditor) return;
          const newName = prompt("請輸入新的工作表名稱：", sheet.name);
          if (newName) {
            sheet.name = newName;
            renderApp();
            autoSaveToFirebase();
          }
        };
        tab.appendChild(titleSpan);

        if (window.appState.sheets.length > 1) {
          const closeBtn = document.createElement('button');
          closeBtn.textContent = '×';
          closeBtn.className = `text-xs px-1.5 rounded hover:bg-black/10`;
          closeBtn.onclick = (e) => {
            e.stopPropagation();
            window.deleteSheet(sheet.id);
          };
          tab.appendChild(closeBtn);
        }

        tab.onclick = () => {
          window.appState.currentSheetId = sheet.id;
          renderApp();
        };
        container.appendChild(tab);
      });
    }

    window.addSheet = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const newId = 'sheet_' + Date.now();
      window.appState.sheets.push({
        id: newId,
        name: '新工作表 ' + (window.appState.sheets.length + 1),
        columns: [
          { key: 'category', title: '類別' },
          { key: 'm1', title: 'May-25' },
          { key: 'm2', title: 'Jun-25' }
        ],
        data: []
      });
      window.appState.currentSheetId = newId;
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteSheet = function(id) {
      if (!window.isAuthorizedEditor) return;
      if (window.appState.sheets.length <= 1) { alert("至少需保留一個工作表！"); return; }
      if (confirm("確定要刪除此工作表嗎？")) {
        window.appState.sheets = window.appState.sheets.filter(s => s.id !== id);
        window.appState.currentSheetId = window.appState.sheets[0].id;
        renderApp();
        autoSaveToFirebase();
      }
    };

    function renderTable() {
      const sheetIndex = window.appState.sheets.findIndex(s => s.id === window.appState.currentSheetId);
      const sheet = window.appState.sheets[sheetIndex] || window.appState.sheets[0];
      const table = document.getElementById('app-table');
      table.innerHTML = '';

      const thead = document.createElement('thead');
      thead.className = 'bg-slate-50 border-b text-slate-600 text-xs uppercase tracking-wider';
      let headerTr = document.createElement('tr');
      sheet.columns.forEach((col, idx) => {
        let th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold';
        th.innerHTML = `<input type="text" value="${col.title}" onchange="window.updateColTitle(${idx}, this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none w-full">`;
        headerTr.appendChild(th);
      });
      thead.appendChild(headerTr);
      table.appendChild(thead);

      let colExtremes = {};
      // 如果是產值分析 (sheetIndex === 0) 保留原樣；若不是則維持一般可編輯
      const tbody = document.createElement('tbody');
      tbody.className = 'divide-y divide-slate-100 text-sm';
      sheet.data.forEach((row, rowIdx) => {
        let tr = document.createElement('tr');
        sheet.columns.forEach((col, cIdx) => {
          let td = document.createElement('td');
          td.className = 'px-4 py-2.5 transition-colors duration-200';
          let val = row[col.key] !== undefined ? row[col.key] : '';

          td.innerHTML = `<input type="text" value="${val}" onchange="window.updateCell(${rowIdx}, '${col.key}', this.value)" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 focus:bg-white focus:outline-none px-1 py-0.5">`;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    window.addRow = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      let newRow = {};
      sheet.columns.forEach((c, idx) => newRow[c.key] = idx === 0 ? '新類別' : 0);
      sheet.data.push(newRow);
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteLastRow = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.data.length > 0) {
        sheet.data.pop();
        renderApp();
        autoSaveToFirebase();
      }
    };

    window.addColumn = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      const colTitle = prompt("請輸入新欄位標題 (例如 2026/5/4)：");
      if (!colTitle) return;
      const colKey = 'col_' + Date.now();
      sheet.columns.push({ key: colKey, title: colTitle });
      sheet.data.forEach(r => r[colKey] = 0);
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteLastColumn = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.columns.length > 2) {
        const removed = sheet.columns.pop();
        sheet.data.forEach(r => delete r[removed.key]);
        renderApp();
        autoSaveToFirebase();
      } else {
        alert("至少需保留兩個基本欄位！");
      }
    };

    window.updateCell = function(rowIdx, key, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.data[rowIdx][key] = val;
      autoSaveToFirebase();
    };

    window.updateColTitle = function(colIdx, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.columns[colIdx].title = val;
      autoSaveToFirebase();
    };

    // ==========================================
    // 3. 圖表與熱力表引擎
    // ==========================================
    function renderCharts() {
      const container = document.getElementById('charts-container');
      container.innerHTML = '';
      const sheetIndex = window.appState.sheets.findIndex(s => s.id === window.appState.currentSheetId);
      const sheet = window.appState.sheets[sheetIndex];

      if (sheetIndex === 0) {
        const chartIds = ['sc1', 'sc2', 'sc3', 'sc4', 'sc5', 'sc6', 'sc7', 'sc8'];
        const chartTitles = ['產值同期比較(石墨)', '產值同期比較(鎢鉬鉭)', '產值同期比較(other)', '產值同期比較(合計)', '石墨累積產值', '鎢鉬鉭累積產值', 'other累積產值', '合計累積產值'];

        chartIds.forEach((id, idx) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'bg-white p-5 rounded-xl shadow-sm border flex flex-col';
          wrapper.id = `export-area-${id}`;
          wrapper.innerHTML = `
            <div class="flex justify-between items-center mb-4">
              <h3 id="title-${id}" class="font-semibold text-slate-700 text-sm">${chartTitles[idx]}</h3>
              <button onclick="window.exportChartToPNG('${id}', '${chartTitles[idx]}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded transition">匯出圖片</button>
            </div>
            <div class="relative h-72 w-full">
              <canvas id="canvas-${id}"></canvas>
            </div>
          `;
          container.appendChild(wrapper);
        });

        if (sheet) buildAllEightComparisonCharts(sheet);

      } else if (sheetIndex === 1) {
        // 第二個工作表：WIP 每月平均熱力表
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-white p-6 rounded-xl shadow-sm border flex flex-col md:col-span-2';
        wrapper.id = `export-area-sheet2-heatmap`;
        wrapper.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 class="font-bold text-slate-800 text-lg">線上WIP - 每月平均熱力表</h3>
              <p class="text-xs text-slate-500 mt-0.5">自動將每日數據按月份加總平均，並以顏色深淺呈現各部門表現</p>
            </div>
            <button onclick="window.exportChartToPNG('sheet2-heatmap', 'WIP每月平均熱力表')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded transition">匯出圖片</button>
          </div>
          <div id="heatmap-container" class="overflow-x-auto w-full"></div>
        `;
        container.appendChild(wrapper);

        buildWipMonthlyHeatmap(sheet);

      } else if (sheetIndex === 2) {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-white p-5 rounded-xl shadow-sm border flex flex-col md:col-span-2';
        wrapper.id = `export-area-sheet3`;
        wrapper.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-slate-700 text-base">${sheet.name} - 趨勢圖</h3>
            <button onclick="window.exportChartToPNG('sheet3', '${sheet.name}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded transition">匯出圖片</button>
          </div>
          <div class="relative h-96 w-full">
            <canvas id="canvas-sheet3"></canvas>
          </div>
        `;
        container.appendChild(wrapper);

        buildWideTableLineChart(sheet);
      }
    }

    function parseNum(val) {
      if (val === undefined || val === null || val === '') return 0;
      let s = String(val).replace(/[^0-9.-]/g, '');
      let n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    // 建立 WIP 每月平均熱力表
    function buildWipMonthlyHeatmap(sheet) {
      const container = document.getElementById('heatmap-container');
      if (!container) return;

      // 1. 收集所有月份並分類每日數據
      // 假設標題格式為 YYYY/M/D 或 YYYY/MM/DD
      let monthMap = {}; // { '2026/05': [colKey1, colKey2, ...] }
      let monthList = [];

      for (let i = 1; i < sheet.columns.length; i++) {
        let col = sheet.columns[i];
        let title = col.title.trim();
        // 嘗試解析出 年/月
        let parts = title.split(/[\/\-]/);
        if (parts.length >= 2) {
          let year = parts[0];
          let month = parts[1].padStart(2, '0');
          let yearMonthKey = `${year}/${month}`;
          if (!monthMap[yearMonthKey]) {
            monthMap[yearMonthKey] = [];
            monthList.push(yearMonthKey);
          }
          monthMap[yearMonthKey].push(col.key);
        }
      }

      monthList.sort();

      if (monthList.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 py-6 text-center">欄位標題未包含有效日期格式 (例如 2026/5/1)，無法計算月平均。</p>`;
        return;
      }

      // 2. 計算每個類別在每個月的平均值
      let processedData = []; // [{ category: '線切割', '2026/05': 8540, ... }]
      let allCellValues = [];

      sheet.data.forEach(row => {
        let catName = String(row[sheet.columns[0].key] || '未命名').trim();
        let rowObj = { category: catName };

        monthList.forEach(ym => {
          let colKeys = monthMap[ym];
          let sum = 0;
          let count = 0;
          colKeys.forEach(ck => {
            let val = parseNum(row[ck]);
            if (val > 0) {
              sum += val;
              count++;
            }
          });
          let avg = count > 0 ? Math.round(sum / count) : 0;
          rowObj[ym] = avg;
          if (avg > 0) allCellValues.push(avg);
        });
        processedData.push(rowObj);
      });

      // 計算全域數值範圍以供熱力著色
      let minVal = allCellValues.length > 0 ? Math.min(...allCellValues) : 0;
      let maxVal = allCellValues.length > 0 ? Math.max(...allCellValues) : 100;

      // 3. 建立 HTML 表格呈現熱力圖
      let html = `<table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-slate-50 border-b text-slate-600 text-xs uppercase">
            <th class="px-4 py-3 font-semibold border-r">類別 / 月份平均</th>`;
      
      monthList.forEach(ym => {
        html += `<th class="px-4 py-3 font-semibold text-center">${ym} 平均</th>`;
      });
      html += `</tr></thead><tbody class="divide-y divide-slate-100">`;

      processedData.forEach(row => {
        html += `<tr class="hover:bg-slate-50/50"><td class="px-4 py-3 font-medium text-slate-700 border-r bg-slate-50/30">${row.category}</td>`;
        
        monthList.forEach(ym => {
          let val = row[ym];
          // 計算熱力顏色 (數值越高顏色越深紅/橘，越低越綠)
          let bgStyle = 'background-color: transparent;';
          if (val > 0 && maxVal !== minVal) {
            let ratio = (val - minVal) / (maxVal - minVal);
            // 漸層色：從淺綠 (ratio=0) 到淺紅 (ratio=1)
            let r = Math.round(239 + (254 - 239) * ratio);
            let g = Math.round(246 + (202 - 246) * ratio);
            let b = Math.round(228 + (202 - 228) * ratio);
            bgStyle = `background-color: rgb(${r}, ${g}, ${b});`;
          } else if (val > 0) {
            bgStyle = `background-color: rgb(254, 226, 226);`;
          }

          html += `<td class="px-4 py-3 text-center font-semibold" style="${bgStyle}">${val > 0 ? val.toLocaleString() : '-'}</td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function buildWideTableLineChart(sheet) {
      const canvas = document.getElementById('canvas-sheet3');
      if (!canvas) return;
      if (window.chartInstances['sheet3']) window.chartInstances['sheet3'].destroy();

      let timeLabels = [];
      for (let i = 1; i < sheet.columns.length; i++) {
        timeLabels.push(sheet.columns[i].title);
      }

      const colorMap = {
        '石墨': '#3b82f6',
        '複材': '#f97316',
        '石墨加複材': '#6b7280'
      };
      const fallbackColors = ['#3b82f6', '#f97316', '#6b7280', '#10b981', '#ef4444', '#8b5cf6'];

      const datasets = sheet.data.map((row, idx) => {
        const catName = String(row[sheet.columns[0].key] || `類別${idx+1}`).trim();
        const dataVals = [];
        for (let i = 1; i < sheet.columns.length; i++) {
          let colKey = sheet.columns[i].key;
          dataVals.push(parseNum(row[colKey]));
        }

        const lineColor = colorMap[catName] || fallbackColors[idx % fallbackColors.length];

        return {
          label: catName,
          data: dataVals,
          borderColor: lineColor,
          backgroundColor: lineColor,
          tension: 0.1,
          borderWidth: 2,
          pointRadius: 3,
          datalabels: { display: false }
        };
      });

      window.chartInstances['sheet3'] = new Chart(canvas, {
        type: 'line',
        data: { labels: timeLabels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' }, title: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
            x: { grid: { display: false } }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function buildAllEightComparisonCharts(sheet) {
      const activeMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug"];
      const materials = ["石墨", "鎢鉬鉭", "other"];

      const numCols = sheet.columns.slice(2);
      const k23 = numCols[numCols.length - 4] ? numCols[numCols.length - 4].key : '2023';
      const k24 = numCols[numCols.length - 3] ? numCols[numCols.length - 3].key : '2024';
      const k25 = numCols[numCols.length - 2] ? numCols[numCols.length - 2].key : '2025';
      const k26 = numCols[numCols.length - 1] ? numCols[numCols.length - 1].key : '2026';

      const label23 = numCols[numCols.length - 4] ? numCols[numCols.length - 4].title : '2023';
      const label24 = numCols[numCols.length - 3] ? numCols[numCols.length - 3].title : '2024';
      const label25 = numCols[numCols.length - 2] ? numCols[numCols.length - 2].title : '2025';
      const label26 = numCols[numCols.length - 1] ? numCols[numCols.length - 1].title : '2026';

      const getMaterialRows = (mat) => {
        return sheet.data.filter(r => {
          let cat = String(r.category || r[sheet.columns[0].key] || '').trim().toLowerCase();
          let mLower = mat.toLowerCase();
          if (mLower === "鎢鉬鉭") return cat.includes("鎢鉬鉭") || cat.includes("鎢鉬鈕");
          if (mLower === "other") return cat.includes("other") || cat.includes("其他");
          return cat.includes(mLower);
        });
      };

      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawBarComparisonChart(`sc${idx+1}`, rows, `${mat}產值同期比較`, k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);
      });
      drawBarComparisonChart('sc4', getCombinedRowsForActiveMonths(materials, sheet, k23, k24, k25, k26, activeMonths), '合計產值同期比較', k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);

      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawCumulativeLineChart(`sc${idx+5}`, rows, `${mat}累積產值`, k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);
      });
      drawCumulativeLineChart('sc8', getCombinedRowsForActiveMonths(materials, sheet, k23, k24, k25, k26, activeMonths), '合計累積產值', k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);
    }

    function getCombinedRowsForActiveMonths(materials, sheet, k23, k24, k25, k26, activeMonths) {
      const allMonthsMap = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      let combined = [];
      activeMonths.forEach((m) => {
        let origIdx = allMonthsMap.indexOf(m);
        let rowObj = { month: m, [k23]: 0, [k24]: 0, [k25]: 0, [k26]: 0 };
        materials.forEach(mat => {
          let mRows = sheet.data.filter(r => {
            let cat = String(r.category || r[sheet.columns[0].key] || '').trim().toLowerCase();
            let mLower = mat.toLowerCase();
            if (mLower === "鎢鉬鉭") return cat.includes("鎢鉬鉭") || cat.includes("鎢鉬鈕");
            if (mLower === "other") return cat.includes("other") || cat.includes("其他");
            return cat.includes(mLower);
          });
          let target = mRows[origIdx];
          if (target) {
            rowObj[k23] += parseNum(target[k23]);
            rowObj[k24] += parseNum(target[k24]);
            rowObj[k25] += parseNum(target[k25]);
            rowObj[k26] += parseNum(target[k26]);
          }
        });
        combined.push(rowObj);
      });
      return combined;
    }

    function drawBarComparisonChart(chartId, rows, titleText, k23, k24, k25, k26, l23, l24, l25, l26, activeMonths) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: activeMonths,
          datasets: [
            { label: l23, data: activeMonths.map((_, i) => parseNum(rows[i]?.[k23])), backgroundColor: '#10b981', datalabels: { display: false } },
            { label: l24, data: activeMonths.map((_, i) => parseNum(rows[i]?.[k24])), backgroundColor: '#3b82f6', datalabels: { display: false } },
            { label: l25, data: activeMonths.map((_, i) => parseNum(rows[i]?.[k25])), backgroundColor: '#f59e0b', datalabels: { display: false } },
            { 
              label: l26, data: activeMonths.map((_, i) => parseNum(rows[i]?.[k26])), backgroundColor: '#ef4444',
              datalabels: {
                display: function(context) { return context.dataIndex === activeMonths.length - 1; },
                align: 'end', anchor: 'end',
                formatter: function() { return '📍'; },
                color: '#ef4444', font: { size: 14 }
              }
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' }, title: { display: false } } },
        plugins: [ChartDataLabels]
      });
    }

    function drawCumulativeLineChart(chartId, rows, titleText, k23, k24, k25, k26, l23, l24, l25, l26, activeMonths) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      let s23 = 0, s24 = 0, s25 = 0, s26 = 0;
      const data23 = activeMonths.map((_, i) => { s23 += parseNum(rows[i]?.[k23]); return s23; });
      const data24 = activeMonths.map((_, i) => { s24 += parseNum(rows[i]?.[k24]); return s24; });
      const data25 = activeMonths.map((_, i) => { s25 += parseNum(rows[i]?.[k25]); return s25; });
      const data26 = activeMonths.map((_, i) => { s26 += parseNum(rows[i]?.[k26]); return s26; });

      const totals = [{ year: l23, val: s23 }, { year: l24, val: s24 }, { year: l25, val: s25 }, { year: l26, val: s26 }];
      totals.sort((a, b) => b.val - a.val);

      const yoyVal = s25 > 0 ? ((s26 - s25) / s25 * 100).toFixed(1) : 0;
      const titleEl = document.getElementById(`title-${chartId}`);
      if (titleEl) {
        titleEl.innerHTML = `${titleText} &nbsp;|&nbsp; <span class="text-xs text-blue-600 font-bold">Top1:${totals[0].year}</span> <span class="text-xs text-slate-500">(YoY: ${yoyVal}%)</span>`;
      }

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: activeMonths,
          datasets: [
            { label: l23, data: data23, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.1, datalabels: { display: false } },
            { label: l24, data: data24, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.1, datalabels: { display: false } },
            { label: l25, data: data25, borderColor: '#f59e0b', backgroundColor: '#f59e0b', tension: 0.1, datalabels: { display: false } },
            { 
              label: l26, data: data26, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.1,
              datalabels: {
                display: function(context) { return context.dataIndex === activeMonths.length - 1; },
                align: 'top', anchor: 'end',
                formatter: function() { return '📍'; },
                color: '#ef4444', font: { size: 14 }
              }
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' }, title: { display: false } } },
        plugins: [ChartDataLabels]
      });
    }

    window.exportToExcel = function() {
      const wb = XLSX.utils.book_new();
      window.appState.sheets.forEach(sheet => {
        const exportData = sheet.data.map(row => {
          let obj = {};
          sheet.columns.forEach(col => { obj[col.title] = row[col.key]; });
          return obj;
        });
        const ws = XLSX.utils.json_to_sheet(exportData);
        XLSX.utils.book_append_sheet(wb, ws, sheet.name);
      });
      XLSX.writeFile(wb, "MFG_Analysis_System.xlsx");
    };

    window.importFromExcel = async function(event) {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限才能匯入！"); return; }
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[1] || workbook.SheetNames[0]; 
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);
        
        if (json.length > 0) {
          const keys = Object.keys(json[0]);
          const columns = keys.map((k, i) => ({ key: i === 0 ? 'category' : 'col_' + i, title: k }));
          const sheetData = json.map(row => {
            let rObj = {};
            keys.forEach((k, i) => { rObj[columns[i].key] = row[k]; });
            return rObj;
          });

          const currentSheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId) || window.appState.sheets[1];
          currentSheet.columns = columns;
          currentSheet.data = sheetData;
          
          renderApp();
          autoSaveToFirebase();
          alert("Excel 匯入成功，並已同步至 Firebase！");
        }
      };
      reader.readAsArrayBuffer(file);
    };

    window.exportChartToPNG = function(chartId, title) {
      const element = document.getElementById(`export-area-${chartId}`);
      if (!element) return;
      html2canvas(element, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${title}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => alert("匯出圖片失敗！"));
    };
  </script>
