<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>MFG Output & Cost Analysis System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (Excel 匯入匯出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas (圖表匯出 PNG) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Firebase SDK (相容版本) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- 登入 Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
      <h2 class="text-2xl font-bold mb-6 text-center text-slate-700">系統登入</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">電子郵件</label>
          <input type="email" id="auth-email" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">密碼</label>
          <input type="password" id="auth-password" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
        </div>
        <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">登入</button>
        <div id="auth-error" class="text-red-500 text-sm text-center hidden"></div>
      </div>
    </div>
  </div>

  <!-- 主導覽列 -->
  <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <h1 class="text-xl font-bold text-slate-800">MFG 分析系統</h1>
      <span id="user-email-display" class="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full">未登入</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="window.exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition">匯出 Excel</button>
      <label class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition cursor-pointer">
        匯入 Excel <input type="file" accept=".xlsx, .xls" class="hidden" onchange="window.importFromExcel(event)">
      </label>
      <button onclick="handleLogout()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-300 transition">登出</button>
    </div>
  </header>

  <!-- 工作表標籤列 -->
  <div class="bg-slate-50 border-b px-6 py-2 flex items-center justify-between overflow-x-auto">
    <div id="sheets-tab-container" class="flex space-x-2 items-center">
      <!-- 動態生成工作表分頁 -->
    </div>
    <button onclick="window.addSheet()" class="bg-slate-800 text-white px-3 py-1.5 rounded-md text-xs font-medium hover:bg-slate-700 transition">+ 新增工作表</button>
  </div>

  <!-- 主內容區 -->
  <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
    <!-- 資料表格操作列 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap gap-3 items-center justify-between">
      <div class="flex items-center space-x-2">
        <button onclick="window.addRow()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ 新增列</button>
        <button onclick="window.deleteLastRow()" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200 transition">刪除最後一列</button>
        <button onclick="window.addColumn()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ 新增欄</button>
        <button onclick="window.deleteLastColumn()" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200 transition">刪除最後一欄</button>
      </div>
      <span class="text-xs text-slate-400">提示：雙擊工作表標籤可直接修改名稱</span>
    </div>

    <!-- 表格檢視區 -->
    <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
      <table id="app-table" class="w-full text-left border-collapse">
        <!-- 動態渲染表格內容 -->
      </table>
    </div>

    <!-- 圖表展示區 -->
    <div id="charts-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 視工作表動態載入對應圖表 -->
    </div>
  </main>

  <script>
    // ==========================================
    // 1. Firebase 設定與初始化
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyB7Oss_eMXO4i4PBs9ZziiREb4r9Ko6a74",
      authDomain: "mfgoutput03.firebaseapp.com",
      databaseURL: "https://mfgoutput03-default-rtdb.firebaseio.com",
      projectId: "mfgoutput03",
      storageBucket: "mfgoutput03.firebasestorage.app",
      messagingSenderId: "1024777823009",
      appId: "1:1024777823009:web:cb476e777a3220de671460",
      measurementId: "G-0805TLXWJH"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // 全域狀態
    window.isAuthorizedEditor = false;
    window.appState = {
      currentSheetId: 'sheet_1',
      sheets: [
        {
          id: 'sheet_1',
          name: '產值分析',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'month', title: '月份' },
            { key: '2023', title: '2023' },
            { key: '2024', title: '2024' },
            { key: '2025', title: '2025' },
            { key: '2026', title: '2026' }
          ],
          data: []
        }
      ]
    };
    window.chartInstances = {};

// 驗證狀態監聽（加入載入中狀態，避免 F5 重新整理時畫面瞬間被清空）
    document.getElementById('user-email-display').textContent = '驗證中...';

    auth.onAuthStateChanged(user => {
      if (user) {
        window.isAuthorizedEditor = true;
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('user-email-display').textContent = user.email;
        loadFromFirebase(); // 成功登入後才會從 Firebase 抓取最新資料
      } else {
        window.isAuthorizedEditor = false;
        document.getElementById('auth-modal').classList.remove('hidden');
        document.getElementById('user-email-display').textContent = '未登入';
        
        // 即使未登入，也可以先載入預設畫面結構，避免畫面空白
        renderApp();
      }
    });

    function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      const errEl = document.getElementById('auth-error');
      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => {
          errEl.textContent = "登入失敗：" + err.message;
          errEl.classList.remove('hidden');
        });
    }

    function handleLogout() {
      auth.signOut();
    }

    function autoSaveToFirebase() {
      if (!window.isAuthorizedEditor) return;
      db.ref('mfg_app_state').set(window.appState);
    }

    function loadFromFirebase() {
      db.ref('mfg_app_state').once('value').then(snapshot => {
        const val = snapshot.val();
        if (val && val.sheets) {
          window.appState = val;
        }
        renderApp();
      });
    }

    // ==========================================
    // 2. 核心渲染與工作表操作
    // ==========================================
    window.renderApp = function() {
      renderSheetsTabs();
      renderTable();
      renderCharts();
    }

    function renderSheetsTabs() {
      const container = document.getElementById('sheets-tab-container');
      container.innerHTML = '';
      window.appState.sheets.forEach(sheet => {
        const isActive = sheet.id === window.appState.currentSheetId;
        const tab = document.createElement('div');
        tab.className = `flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border'}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = sheet.name;
        titleSpan.ondblclick = () => {
          if (!window.isAuthorizedEditor) return;
          const newName = prompt("請輸入新的工作表名稱：", sheet.name);
          if (newName) {
            sheet.name = newName;
            renderApp();
            autoSaveToFirebase();
          }
        };
        tab.appendChild(titleSpan);

        if (window.appState.sheets.length > 1) {
          const closeBtn = document.createElement('button');
          closeBtn.textContent = '×';
          closeBtn.className = `text-xs px-1.5 rounded hover:bg-black/10`;
          closeBtn.onclick = (e) => {
            e.stopPropagation();
            window.deleteSheet(sheet.id);
          };
          tab.appendChild(closeBtn);
        }

        tab.onclick = () => {
          window.appState.currentSheetId = sheet.id;
          renderApp();
        };
        container.appendChild(tab);
      });
    }

    window.addSheet = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const newId = 'sheet_' + Date.now();
      window.appState.sheets.push({
        id: newId,
        name: '新工作表 ' + (window.appState.sheets.length + 1),
        columns: [
          { key: 'category', title: '類別' },
          { key: 'month', title: '月份' },
          { key: '2023', title: '2023' },
          { key: '2024', title: '2024' },
          { key: '2025', title: '2025' },
          { key: '2026', title: '2026' }
        ],
        data: []
      });
      window.appState.currentSheetId = newId;
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteSheet = function(id) {
      if (!window.isAuthorizedEditor) return;
      if (window.appState.sheets.length <= 1) { alert("至少需保留一個工作表！"); return; }
      if (confirm("確定要刪除此工作表嗎？")) {
        window.appState.sheets = window.appState.sheets.filter(s => s.id !== id);
        window.appState.currentSheetId = window.appState.sheets[0].id;
        renderApp();
        autoSaveToFirebase();
      }
    };

    function renderTable() {
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId) || window.appState.sheets[0];
      const table = document.getElementById('app-table');
      table.innerHTML = '';

      // 表頭
      const thead = document.createElement('thead');
      thead.className = 'bg-slate-50 border-b text-slate-600 text-xs uppercase tracking-wider';
      let headerTr = document.createElement('tr');
      sheet.columns.forEach((col, idx) => {
        let th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold';
        th.innerHTML = `<input type="text" value="${col.title}" onchange="window.updateColTitle(${idx}, this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none w-full">`;
        headerTr.appendChild(th);
      });
      thead.appendChild(headerTr);
      table.appendChild(thead);

      // 表身
      const tbody = document.createElement('tbody');
      tbody.className = 'divide-y divide-slate-100 text-sm';
      sheet.data.forEach((row, rowIdx) => {
        let tr = document.createElement('tr');
        sheet.columns.forEach(col => {
          let td = document.createElement('td');
          td.className = 'px-4 py-2.5';
          let val = row[col.key] !== undefined ? row[col.key] : '';
          td.innerHTML = `<input type="text" value="${val}" onchange="window.updateCell(${rowIdx}, '${col.key}', this.value)" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 focus:bg-white focus:outline-none px-1 py-0.5">`;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    window.addRow = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      let newRow = {};
      sheet.columns.forEach((c, idx) => newRow[c.key] = idx === 0 ? '石墨' : (idx === 1 ? 'Jan' : 0));
      sheet.data.push(newRow);
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteLastRow = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.data.length > 0) {
        sheet.data.pop();
        renderApp();
        autoSaveToFirebase();
      }
    };

    window.addColumn = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      const colTitle = prompt("請輸入新欄位標題 (例: 2027)：");
      if (!colTitle) return;
      const colKey = 'col_' + Date.now();
      sheet.columns.push({ key: colKey, title: colTitle });
      sheet.data.forEach(r => r[colKey] = 0);
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteLastColumn = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.columns.length > 2) {
        const removed = sheet.columns.pop();
        sheet.data.forEach(r => delete r[removed.key]);
        renderApp();
        autoSaveToFirebase();
      } else {
        alert("至少需保留兩個基本欄位！");
      }
    };

    window.updateCell = function(rowIdx, key, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.data[rowIdx][key] = val;
      autoSaveToFirebase();
    };

    window.updateColTitle = function(colIdx, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.columns[colIdx].title = val;
      autoSaveToFirebase();
    };

    // ==========================================
    // 3. 圖表動態生成引擎
    // ==========================================
    function renderCharts() {
      const container = document.getElementById('charts-container');
      container.innerHTML = '';
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      
      const chartIds = ['sc1', 'sc2', 'sc3', 'sc4', 'sc5', 'sc6', 'sc7', 'sc8'];
      const chartTitles = ['產值同期比較(石墨)', '產值同期比較(鎢鉬鈕)', '產值同期比較(其他)', '產值同期比較(合計)', '石墨累積產值', '鎢鉬鈕累積產值', '其他累積產值', '合計累積產值'];

      chartIds.forEach((id, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-white p-5 rounded-xl shadow-sm border flex flex-col';
        wrapper.id = `export-area-${id}`;
        wrapper.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-slate-700 text-sm">${chartTitles[idx]}</h3>
            <button onclick="window.exportChartToPNG('${id}', '${chartTitles[idx]}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded transition">匯出圖片</button>
          </div>
          <div class="relative h-64 w-full">
            <canvas id="canvas-${id}"></canvas>
          </div>
        `;
        container.appendChild(wrapper);
      });

      buildAllEightComparisonCharts(sheet);
    }

    function parseNum(val) {
      if (val === undefined || val === null || val === '') return 0;
      let s = String(val).replace(/[^0-9.-]/g, '');
      let n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function buildAllEightComparisonCharts(sheet) {
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const materials = ["石墨", "鎢鉬鈕", "其他"];

      const findKey = (yearStr) => {
        let col = sheet.columns.find(c => String(c.title).includes(yearStr) || String(c.key).includes(yearStr));
        return col ? col.key : yearStr;
      };
      const k23 = findKey('2023');
      const k24 = findKey('2024');
      const k25 = findKey('2025');
      const k26 = findKey('2026');

      const getMaterialRows = (mat) => {
        return sheet.data.filter(r => {
          let cat = String(r.category || r[sheet.columns[0].key] || '').trim();
          return cat.includes(mat);
        });
      };

      const getCombinedRows = () => {
        let combined = [];
        months.forEach((m, idx) => {
          let rowObj = { month: m, [k23]: 0, [k24]: 0, [k25]: 0, [k26]: 0 };
          materials.forEach(mat => {
            let mRows = getMaterialRows(mat);
            let target = mRows[idx];
            if (target) {
              rowObj[k23] += parseNum(target[k23]);
              rowObj[k24] += parseNum(target[k24]);
              rowObj[k25] += parseNum(target[k25]);
              rowObj[k26] += parseNum(target[k26]);
            }
          });
          combined.push(rowObj);
        });
        return combined;
      };

      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawBarComparisonChart(`sc${idx+1}`, rows, `${mat}產值同期比較`, k23, k24, k25, k26);
      });
      drawBarComparisonChart('sc4', getCombinedRows(), '合計產值同期比較', k23, k24, k25, k26);

      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawCumulativeLineChart(`sc${idx+5}`, rows, `${mat}累積產值`, k23, k24, k25, k26);
      });
      drawCumulativeLineChart('sc8', getCombinedRows(), '合計累積產值', k23, k24, k25, k26);
    }

    function drawBarComparisonChart(chartId, rows, titleText, k23, k24, k25, k26) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      const labels = rows.map(r => r.month || r[Object.keys(r)[1]] || 'Month');
      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: '2023', data: rows.map(r => parseNum(r[k23])), backgroundColor: '#10b981' },
            { label: '2024', data: rows.map(r => parseNum(r[k24])), backgroundColor: '#3b82f6' },
            { label: '2025', data: rows.map(r => parseNum(r[k25])), backgroundColor: '#f59e0b' },
            { label: '2026', data: rows.map(r => parseNum(r[k26])), backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' }, title: { display: false, text: titleText } }
        }
      });
    }

function drawCumulativeLineChart(chartId, rows, titleText, k23, k24, k25, k26) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      const labels = rows.map(r => r.month || r[Object.keys(r)[1]] || 'Month');
      
      let sum23 = 0, sum24 = 0, sum25 = 0, sum26 = 0;
      let has26Started = false;

      const data23 = rows.map(r => { sum23 += parseNum(r[k23]); return sum23; });
      const data24 = rows.map(r => { sum24 += parseNum(r[k24]); return sum24; });
      const data25 = rows.map(r => { sum25 += parseNum(r[k25]); return sum25; });
      
      // 針對 2026 年：檢查該月份是否有實際數值，若後續月份皆無資料則中斷不顯示
      const data26 = rows.map(r => {
        let val = parseNum(r[k26]);
        // 判斷該列是否有填寫 2026 資料（若大於 0 代表有統計）
        if (val > 0 || r[k26] !== undefined && r[k26] !== '') {
          sum26 += val;
          return sum26;
        } else {
          // 如果該月沒有資料，回傳 null 讓 Chart.js 折線圖在該點斷開，不往後延伸
          return null; 
        }
      });

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: '2023', data: data23, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.1, spanGaps: false },
            { label: '2024', data: data24, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.1, spanGaps: false },
            { label: '2025', data: data25, borderColor: '#f59e0b', backgroundColor: '#f59e0b', tension: 0.1, spanGaps: false },
            { label: '2026', data: data26, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.1, spanGaps: false }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' }, title: { display: false, text: titleText } }
        }
      });
    }

    window.exportToExcel = function() {
      const wb = XLSX.utils.book_new();
      window.appState.sheets.forEach(sheet => {
        const exportData = sheet.data.map(row => {
          let obj = {};
          sheet.columns.forEach(col => { obj[col.title] = row[col.key]; });
          return obj;
        });
        const ws = XLSX.utils.json_to_sheet(exportData);
        XLSX.utils.book_append_sheet(wb, ws, sheet.name);
      });
      XLSX.writeFile(wb, "MFG_Analysis_System.xlsx");
    };

    window.importFromExcel = async function(event) {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限才能匯入！"); return; }
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);
        
        if (json.length > 0) {
          const keys = Object.keys(json[0]);
          const columns = keys.map((k, i) => ({ key: i === 0 ? 'category' : (i === 1 ? 'month' : k), title: k }));
          const sheetData = json.map(row => {
            let rObj = {};
            keys.forEach((k, i) => { rObj[columns[i].key] = row[k]; });
            return rObj;
          });

          const currentSheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId) || window.appState.sheets[0];
          currentSheet.columns = columns;
          currentSheet.data = sheetData;
          
          renderApp();
          autoSaveToFirebase();
          alert("Excel 匯入成功，並已同步至 Firebase！");
        }
      };
      reader.readAsArrayBuffer(file);
    };

    window.exportChartToPNG = function(chartId, title) {
      const element = document.getElementById(`export-area-${chartId}`);
      if (!element) return;
      html2canvas(element, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${title}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => alert("匯出圖片失敗！"));
    };
  </script>
</body>
</html>
