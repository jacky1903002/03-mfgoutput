<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFG Output & Cost Analysis System</title>
  
  <!-- 效能優化：預先連線外部 CDN 資源 -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://www.gstatic.com">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <!-- Chart.js DataLabels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js" defer></script>
  <!-- SheetJS (Excel 匯入/匯出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <!-- html2canvas (圖表匯出 PNG) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- 1. 入口全螢幕 Firebase 登入遮罩 -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">MFG 產能分析系統</h2>
        <p class="text-sm text-slate-500 mt-1">請輸入 Firebase 電子郵件與密碼登入</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">電子郵件 (Email)</label>
          <input type="email" id="auth-email" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">密碼 (Password)</label>
          <input type="password" id="auth-password" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="••••••••">
        </div>
        <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition shadow-md shadow-blue-200 active:scale-[0.99]">驗證並登入</button>
        <div id="auth-error" class="text-red-500 text-xs text-center hidden bg-red-50 p-2.5 rounded-lg border border-red-100"></div>
      </div>
    </div>
  </div>

  <!-- 2. 主專案內容區塊 (未登入前預設隱藏 hidden) -->
  <div id="app-container" class="hidden flex-col min-h-screen">
    <!-- 主導覽列 -->
    <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center flex-wrap gap-4">
      <div class="flex items-center space-x-4">
        <h1 class="text-xl font-bold text-slate-800">產值與同期比較&線上即時WIP&複材占比</h1>
        <span id="user-email-display" class="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full font-medium">驗證中...</span>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- 動態時間顯示 Banner -->
        <div class="update-banner text-xs text-slate-500 flex items-center space-x-1 bg-slate-50 px-3 py-1.5 rounded-lg border">
          <i class="fa-regular fa-clock"></i>
          <span>上次更新日期時間：</span><span id="last-update-time-text" class="font-medium text-slate-700">讀取中...</span>
        </div>

        <div class="flex items-center space-x-3">
          <!-- 一鍵匯出所有工作表按鈕 -->
          <button onclick="window.exportAllSheetsToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition flex items-center space-x-1.5 shadow-sm">
            <i class="fa-solid fa-file-export text-xs"></i>
            <span>一鍵匯出所有工作表</span>
          </button>
          
          <!-- 一鍵匯入所有工作表按鈕 -->
          <label class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition cursor-pointer flex items-center space-x-1.5 shadow-sm">
            <i class="fa-solid fa-file-circle-plus text-xs"></i>
            <span>一鍵匯入所有工作表</span>
            <input type="file" accept=".xlsx, .xls" class="hidden" onchange="window.importAllSheetsFromExcel(event)">
          </label>
          <button onclick="handleLogout()" class="bg-rose-50 text-rose-600 border border-rose-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-rose-100 transition">登出系統</button>
        </div>
      </div>
    </header>

    <!-- 工作表標籤列 -->
    <div class="bg-slate-50 border-b px-6 py-2 flex items-center justify-between overflow-x-auto">
      <div id="sheets-tab-container" class="flex space-x-2 items-center"></div>
      <button onclick="window.addSheet()" class="bg-slate-800 text-white px-3 py-1.5 rounded-md text-xs font-medium hover:bg-slate-700 transition">+ 新增工作表</button>
    </div>

    <!-- 主內容區 -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-wrap gap-3 items-center justify-between">
        <div class="flex items-center space-x-2">
          <button onclick="window.addRow()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ 新增列</button>
          <button onclick="window.deleteLastRow()" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200 transition">刪除最後一列</button>
          <button onclick="window.addColumn()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ 新增欄</button>
          <button onclick="window.deleteLastColumn()" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-rose-200 transition">刪除最後一欄</button>
        </div>
        <span class="text-xs text-slate-400">提示：雙擊工作表標籤可直接修改名稱</span>
      </div>

      <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
        <table id="app-table" class="w-full text-left border-collapse"></table>
      </div>

      <div id="charts-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>
  </div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDnJaCiYw7RdMsVIoDCWGutWP4crMfwX8k",
      authDomain: "mfgoutput03-372cc.firebaseapp.com",
      projectId: "mfgoutput03-372cc",
      storageBucket: "mfgoutput03-372cc.firebasestorage.app",
      messagingSenderId: "54967690563",
      appId: "1:54967690563:web:e2679e5d39891977acbbf6",
      measurementId: "G-ZFTQT9M7F3"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const defaultState = {
      currentSheetId: 'sheet_1',
      updatedAt: null,
      sheets: [
        {
          id: 'sheet_1',
          name: '產值分析',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'month', title: '月份' },
            { key: '2023', title: '2023' },
            { key: '2024', title: '2024' },
            { key: '2025', title: '2025' },
            { key: '2026', title: '2026' }
          ],
          data: []
        },
        {
          id: 'sheet_2',
          name: '線上WIP',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'May-26', title: 'May-26' },
            { key: 'Jun-26', title: 'Jun-26' },
            { key: 'Jul-26', title: 'Jul-26' },
            { key: 'Aug-26', title: 'Aug-26' },
            { key: 'Sep-26', title: 'Sep-26' }
          ],
          data: [
            { category: '線切割', 'May-26': 10404, 'Jun-26': 7996, 'Jul-26': 7865, 'Aug-26': 10368, 'Sep-26': 8219 },
            { category: '金屬一課', 'May-26': 8577, 'Jun-26': 9414, 'Jul-26': 8363, 'Aug-26': 10913, 'Sep-26': 10522 },
            { category: '金屬二課', 'May-26': 10690, 'Jun-26': 7596, 'Jul-26': 10942, 'Aug-26': 7758, 'Sep-26': 8800 },
            { category: '車床課', 'May-26': 10171, 'Jun-26': 8541, 'Jul-26': 8072, 'Aug-26': 10916, 'Sep-26': 9189 },
            { category: '最終檢驗', 'May-26': 8106, 'Jun-26': 10719, 'Jul-26': 8666, 'Aug-26': 8028, 'Sep-26': 10365 },
            { category: '表面處理', 'May-26': 7468, 'Jun-26': 10138, 'Jul-26': 8875, 'Aug-26': 10351, 'Sep-26': 7622 },
            { category: '後處理', 'May-26': 9806, 'Jun-26': 10804, 'Jul-26': 9468, 'Aug-26': 9993, 'Sep-26': 9153 }
          ]
        },
        {
          id: 'sheet_3',
          name: '石墨複合材占比',
          columns: [
            { key: 'category', title: '類別' },
            { key: 'm1', title: 'May-25' },
            { key: 'm2', title: 'Jun-25' }
          ],
          data: [
            { category: '石墨', m1: 8489, m2: 8474 },
            { category: '複材', m1: 10582, m2: 8292 }
          ]
        }
      ]
    };

    const localCachedState = localStorage.getItem('mfg_app_state_cache');
    window.appState = localCachedState ? JSON.parse(localCachedState) : defaultState;
    // 每次重新整理或開啟頁面，強制切換至第一個工作表
    if (window.appState && window.appState.sheets && window.appState.sheets.length > 0) {
      window.appState.currentSheetId = window.appState.sheets[0].id;
    }

    window.isAuthorizedEditor = false;
    window.chartInstances = {};

    window.formatDateTime = function(isoString) {
      if (!isoString) return '尚無更新紀錄';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const yr = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hr = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${yr}年${m}月${day}日 ${hr}:${min}`;
    };

    window.updateTimeDisplay = function() {
      const timeEl = document.getElementById('last-update-time-text');
      if (timeEl) {
        timeEl.innerText = window.appState.updatedAt ? window.formatDateTime(window.appState.updatedAt) : '尚未記錄';
      }
    };

    // Firebase 身分認證監聽：必須登入才能看到與操作系統
    auth.onAuthStateChanged(user => {
      const modal = document.getElementById('auth-modal');
      const container = document.getElementById('app-container');
      const emailDisplay = document.getElementById('user-email-display');

      if (user) {
        window.isAuthorizedEditor = true;
        modal.classList.add('hidden');
        container.classList.remove('hidden');
        container.classList.add('flex');
        emailDisplay.textContent = user.email;
        loadFromFirebase();
      } else {
        window.isAuthorizedEditor = false;
        modal.classList.remove('hidden');
        container.classList.add('hidden');
        container.classList.remove('flex');
        emailDisplay.textContent = '未登入';
      }
    });

    window.handleLogin = function() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value;
      const errEl = document.getElementById('auth-error');
      
      if (!email || !pass) {
        errEl.textContent = "請輸入電子郵件與密碼！";
        errEl.classList.remove('hidden');
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          errEl.classList.add('hidden');
          document.getElementById('auth-password').value = '';
        })
        .catch(err => {
          errEl.textContent = "登入失敗：" + err.message;
          errEl.classList.remove('hidden');
        });
    };

    window.handleLogout = function() {
      auth.signOut();
    };

    function autoSaveToFirebase() {
      if (!window.isAuthorizedEditor) return;
      
      window.appState.updatedAt = new Date().toISOString();
      window.updateTimeDisplay();

      localStorage.setItem('mfg_app_state_cache', JSON.stringify(window.appState));
      
      const sanitizedState = JSON.parse(JSON.stringify(window.appState, (key, value) => {
        return (value === undefined) ? null : value;
      }));

      db.ref('mfg_app_state').set(sanitizedState).catch(err => {
        console.error("同步至 Firebase 失敗:", err);
      });
    }

    function loadFromFirebase() {
      db.ref('mfg_app_state').once('value').then(snapshot => {
        const val = snapshot.val();
        if (val && val.sheets && val.sheets.length > 0) {
          window.appState = val;
          // 重整載入時強制選取第一個工作表
          window.appState.currentSheetId = val.sheets[0].id;
          localStorage.setItem('mfg_app_state_cache', JSON.stringify(window.appState));
        } else {
          window.appState.updatedAt = new Date().toISOString();
          window.appState.currentSheetId = window.appState.sheets[0].id;
          db.ref('mfg_app_state').set(window.appState);
        }
        window.updateTimeDisplay();
        renderApp();

        db.ref('mfg_app_state').on('value', snap => {
          const liveVal = snap.val();
          if (liveVal && liveVal.sheets && liveVal.sheets.length > 0) {
            const currentTabId = window.appState.currentSheetId || liveVal.sheets[0].id;
            window.appState = liveVal;
            // 保持當前正在查看的工作表，若無則預設第一個
            window.appState.currentSheetId = liveVal.sheets.some(s => s.id === currentTabId) ? currentTabId : liveVal.sheets[0].id;
            localStorage.setItem('mfg_app_state_cache', JSON.stringify(window.appState));
            window.updateTimeDisplay();
            renderApp();
          }
        });
      }).catch(err => {
        console.error("載入 Firebase 失敗:", err);
        window.updateTimeDisplay();
        renderApp();
      });
    }

    // 核心渲染與工作表操作
    window.renderApp = function() {
      renderSheetsTabs();
      renderTable();
      renderCharts();
      window.updateTimeDisplay();
    }

    function renderSheetsTabs() {
      const container = document.getElementById('sheets-tab-container');
      container.innerHTML = '';
      window.appState.sheets.forEach(sheet => {
        const isActive = sheet.id === window.appState.currentSheetId;
        const tab = document.createElement('div');
        tab.className = `flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition ${isActive ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border'}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = sheet.name;
        titleSpan.ondblclick = () => {
          if (!window.isAuthorizedEditor) return;
          const newName = prompt("請輸入新的工作表名稱：", sheet.name);
          if (newName) {
            sheet.name = newName;
            renderApp();
            autoSaveToFirebase();
          }
        };
        tab.appendChild(titleSpan);

        if (window.appState.sheets.length > 1) {
          const closeBtn = document.createElement('button');
          closeBtn.textContent = '×';
          closeBtn.className = `text-xs px-1.5 rounded hover:bg-black/10`;
          closeBtn.onclick = (e) => {
            e.stopPropagation();
            window.deleteSheet(sheet.id);
          };
          tab.appendChild(closeBtn);
        }

        tab.onclick = () => {
          window.appState.currentSheetId = sheet.id;
          renderApp();
        };
        container.appendChild(tab);
      });
    }

    window.addSheet = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const newId = 'sheet_' + Date.now();
      window.appState.sheets.push({
        id: newId,
        name: '新工作表 ' + (window.appState.sheets.length + 1),
        columns: [
          { key: 'category', title: '類別' },
          { key: 'm1', title: 'May-26' },
          { key: 'm2', title: 'Jun-26' }
        ],
        data: []
      });
      window.appState.currentSheetId = newId;
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteSheet = function(id) {
      if (!window.isAuthorizedEditor) return;
      if (window.appState.sheets.length <= 1) { alert("至少需保留一個工作表！"); return; }
      if (confirm("確定要刪除此工作表嗎？")) {
        window.appState.sheets = window.appState.sheets.filter(s => s.id !== id);
        window.appState.currentSheetId = window.appState.sheets[0].id;
        renderApp();
        autoSaveToFirebase();
      }
    };

    function renderTable() {
      const sheetIndex = window.appState.sheets.findIndex(s => s.id === window.appState.currentSheetId);
      const sheet = window.appState.sheets[sheetIndex] || window.appState.sheets[0];
      const table = document.getElementById('app-table');
      table.innerHTML = '';

      const thead = document.createElement('thead');
      thead.className = 'bg-slate-50 border-b text-slate-600 text-xs uppercase tracking-wider';
      let headerTr = document.createElement('tr');
      sheet.columns.forEach((col, idx) => {
        let th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold';
        th.innerHTML = `<input type="text" value="${col.title}" onchange="window.updateColTitle(${idx}, this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none w-full">`;
        headerTr.appendChild(th);
      });
      thead.appendChild(headerTr);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      tbody.className = 'divide-y divide-slate-100 text-sm';
      sheet.data.forEach((row, rowIdx) => {
        let tr = document.createElement('tr');
        sheet.columns.forEach((col) => {
          let td = document.createElement('td');
          td.className = 'px-4 py-2.5 transition-colors duration-200';
          let val = row[col.key] !== undefined ? row[col.key] : '';

          td.innerHTML = `<input type="text" value="${val}" onchange="window.updateCell(${rowIdx}, '${col.key}', this.value)" class="w-full bg-transparent border-b border-transparent focus:border-blue-500 focus:bg-white focus:outline-none px-1 py-0.5">`;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    window.addRow = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      let newRow = {};
      sheet.columns.forEach((c, idx) => newRow[c.key] = idx === 0 ? '新類別' : 0);
      sheet.data.push(newRow);
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteLastRow = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.data.length > 0) {
        sheet.data.pop();
        renderApp();
        autoSaveToFirebase();
      }
    };

    window.addColumn = function() {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限！"); return; }
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      const colTitle = prompt("請輸入新欄位名稱 (例如 Jul-26)：");
      if (!colTitle) return;
      const colKey = 'col_' + Date.now();
      sheet.columns.push({ key: colKey, title: colTitle });
      sheet.data.forEach(r => r[colKey] = 0);
      renderApp();
      autoSaveToFirebase();
    };

    window.deleteLastColumn = function() {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      if (sheet.columns.length > 2) {
        const removed = sheet.columns.pop();
        sheet.data.forEach(r => delete r[removed.key]);
        renderApp();
        autoSaveToFirebase();
      } else {
        alert("至少需保留兩個基本欄位！");
      }
    };

    window.updateCell = function(rowIdx, key, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.data[rowIdx][key] = val;
      renderCharts();
      autoSaveToFirebase();
    };

    window.updateColTitle = function(colIdx, val) {
      if (!window.isAuthorizedEditor) return;
      const sheet = window.appState.sheets.find(s => s.id === window.appState.currentSheetId);
      sheet.columns[colIdx].title = val;
      renderCharts();
      autoSaveToFirebase();
    };

    // 圖表與熱力表引擎
    function renderCharts() {
      const container = document.getElementById('charts-container');
      container.innerHTML = '';
      const sheetIndex = window.appState.sheets.findIndex(s => s.id === window.appState.currentSheetId);
      const sheet = window.appState.sheets[sheetIndex];

      if (sheetIndex === 0) {
        const chartIds = ['sc1', 'sc2', 'sc3', 'sc4', 'sc5', 'sc6', 'sc7', 'sc8'];
        const chartTitles = ['產值同期比較(石墨)', '產值同期比較(鎢鉬鉭)', '產值同期比較(other)', '產值同期比較(合計)', '石墨累積產值', '鎢鉬鉭累積產值', 'other累積產值', '合計累積產值'];

        chartIds.forEach((id, idx) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'bg-white p-5 rounded-xl shadow-sm border flex flex-col';
          wrapper.id = `export-area-${id}`;
          wrapper.innerHTML = `
            <div class="flex justify-between items-center mb-4">
              <h3 id="title-${id}" class="font-semibold text-slate-700 text-sm">${chartTitles[idx]}</h3>
              <button onclick="window.exportChartToPNG('${id}', '${chartTitles[idx]}')" class="export-btn text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded transition">匯出圖片</button>
            </div>
            <div class="relative h-72 w-full">
              <canvas id="canvas-${id}"></canvas>
            </div>
          `;
          container.appendChild(wrapper);
        });

        if (sheet) buildAllEightComparisonCharts(sheet);

      } else if (sheetIndex === 1) {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-white p-6 rounded-xl shadow-sm border flex flex-col md:col-span-2';
        wrapper.id = `export-area-sheet2-heatmap`;
        wrapper.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 class="font-bold text-slate-800 text-lg">線上WIP - 熱力圖分析</h3>
              <p class="text-xs text-slate-500 mt-0.5">依各部門(列)各自獨立呈現大紅小綠對比</p>
            </div>
            <button onclick="window.exportChartToPNG('sheet2-heatmap', 'WIP熱力圖')" class="export-btn text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded transition">匯出圖片</button>
          </div>
          <div id="heatmap-container" class="overflow-x-auto w-full"></div>
        `;
        container.appendChild(wrapper);

        buildWipHeatmapDirect(sheet);

      } else if (sheetIndex === 2) {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-white p-5 rounded-xl shadow-sm border flex flex-col md:col-span-2';
        wrapper.id = `export-area-sheet3`;
        wrapper.innerHTML = `
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-slate-700 text-base">${sheet.name} - 趨勢圖</h3>
            <button onclick="window.exportChartToPNG('sheet3', '${sheet.name}')" class="export-btn text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded transition">匯出圖片</button>
          </div>
          <div class="relative h-96 w-full">
            <canvas id="canvas-sheet3"></canvas>
          </div>
        `;
        container.appendChild(wrapper);

        buildWideTableLineChart(sheet);
      }
    }

    function parseNum(val) {
      if (val === undefined || val === null || val === '') return 0;
      let s = String(val).replace(/,/g, '');
      let n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function buildWipHeatmapDirect(sheet) {
      const container = document.getElementById('heatmap-container');
      if (!container) return;

      let cols = sheet.columns.slice(1);
      if (cols.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 py-6 text-center">無可用欄位。</p>`;
        return;
      }

      let html = `<table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-slate-50 border-b text-slate-600 text-xs uppercase">
            <th class="px-4 py-3 font-semibold border-r">類別</th>`;
      
      cols.forEach(col => {
        html += `<th class="px-4 py-3 font-semibold text-center">${col.title}</th>`;
      });
      html += `</tr></thead><tbody class="divide-y divide-slate-100">`;

      sheet.data.forEach(row => {
        let catName = String(row[sheet.columns[0].key] || '未命名').trim();
        let rowValues = [];
        cols.forEach(col => {
          let v = Math.round(parseNum(row[col.key]));
          if (v > 0) rowValues.push(v);
        });

        let rowMin = rowValues.length > 0 ? Math.min(...rowValues) : 0;
        let rowMax = rowValues.length > 0 ? Math.max(...rowValues) : 100;

        html += `<tr class="hover:bg-slate-50/50"><td class="px-4 py-3 font-medium text-slate-700 border-r bg-slate-50/30">${catName}</td>`;
        
        cols.forEach(col => {
          let val = Math.round(parseNum(row[col.key]));
          let bgStyle = 'background-color: transparent;';
          let textColor = 'color: inherit;';
          
          if (val > 0 && rowMax !== rowMin) {
            let ratio = (val - rowMin) / (rowMax - rowMin);
            let r = Math.round(187 + (239 - 187) * ratio);
            let g = Math.round(247 + (68 - 247) * ratio);
            let b = Math.round(208 + (68 - 208) * ratio);
            bgStyle = `background-color: rgb(${r}, ${g}, ${b});`;
            
            if (ratio > 0.5) {
              textColor = 'color: #ffffff;';
            }
          } else if (val > 0) {
            bgStyle = `background-color: rgb(239, 68, 68);`;
            textColor = 'color: #ffffff;';
          }

          html += `<td class="px-4 py-3 text-center font-semibold" style="${bgStyle} ${textColor}">${val > 0 ? val.toLocaleString() : '-'}</td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function buildWideTableLineChart(sheet) {
      const canvas = document.getElementById('canvas-sheet3');
      if (!canvas) return;
      if (window.chartInstances['sheet3']) window.chartInstances['sheet3'].destroy();

      let timeLabels = [];
      for (let i = 1; i < sheet.columns.length; i++) {
        timeLabels.push(sheet.columns[i].title);
      }

      const colorMap = {
        '石墨': '#3b82f6',
        '複材': '#f97316',
        '石墨加複材': '#6b7280'
      };
      const fallbackColors = ['#3b82f6', '#f97316', '#6b7280', '#10b981', '#ef4444', '#8b5cf6'];

      const datasets = sheet.data.map((row, idx) => {
        const catName = String(row[sheet.columns[0].key] || `類別${idx+1}`).trim();
        const dataVals = [];
        for (let i = 1; i < sheet.columns.length; i++) {
          let colKey = sheet.columns[i].key;
          dataVals.push(parseNum(row[colKey]));
        }

        const lineColor = colorMap[catName] || fallbackColors[idx % fallbackColors.length];

        return {
          label: catName,
          data: dataVals,
          borderColor: lineColor,
          backgroundColor: lineColor,
          tension: 0.1,
          borderWidth: 2,
          pointRadius: 3,
          datalabels: { display: false }
        };
      });

      window.chartInstances['sheet3'] = new Chart(canvas, {
        type: 'line',
        data: { labels: timeLabels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' }, title: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
            x: { grid: { display: false } }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function buildAllEightComparisonCharts(sheet) {
      const allMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const materials = ["石墨", "鎢鉬鉭", "other"];

      const numCols = sheet.columns.slice(2);
      const k23 = numCols[numCols.length - 4] ? numCols[numCols.length - 4].key : '2023';
      const k24 = numCols[numCols.length - 3] ? numCols[numCols.length - 3].key : '2024';
      const k25 = numCols[numCols.length - 2] ? numCols[numCols.length - 2].key : '2025';
      const k26 = numCols[numCols.length - 1] ? numCols[numCols.length - 1].key : '2026';

      const label23 = numCols[numCols.length - 4] ? numCols[numCols.length - 4].title : '2023';
      const label24 = numCols[numCols.length - 3] ? numCols[numCols.length - 3].title : '2024';
      const label25 = numCols[numCols.length - 2] ? numCols[numCols.length - 2].title : '2025';
      const label26 = numCols[numCols.length - 1] ? numCols[numCols.length - 1].title : '2026';

      let activeMonths = [];
      allMonths.forEach(m => {
        let hasDataInLatestYear = false;
        sheet.data.forEach(row => {
          let rowMonth = String(row.month || row[sheet.columns[1]?.key] || '').trim();
          if (rowMonth === m) {
            let val = parseNum(row[k26]);
            if (val > 0) {
              hasDataInLatestYear = true;
            }
          }
        });
        if (hasDataInLatestYear) {
          activeMonths.push(m);
        }
      });

      if (activeMonths.length === 0 && sheet.data) {
        sheet.data.forEach(r => {
          let m = String(r.month || r[sheet.columns[1]?.key] || '').trim();
          if (m && allMonths.includes(m) && !activeMonths.includes(m)) {
            activeMonths.push(m);
          }
        });
        activeMonths.sort((a, b) => allMonths.indexOf(a) - allMonths.indexOf(b));
      }

      const getMaterialRows = (mat) => {
        return sheet.data.filter(r => {
          let cat = String(r.category || r[sheet.columns[0].key] || '').trim().toLowerCase();
          let mLower = mat.toLowerCase();
          if (mLower === "鎢鉬鉭") return cat.includes("鎢鉬鉭") || cat.includes("鎢鉬鈕");
          if (mLower === "other") return cat.includes("other") || cat.includes("其他");
          return cat.includes(mLower);
        });
      };

      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawBarComparisonChart(`sc${idx+1}`, rows, `${mat}產值同期比較`, k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);
      });
      drawBarComparisonChart('sc4', getCombinedRowsForActiveMonths(materials, sheet, k23, k24, k25, k26, activeMonths), '合計產值同期比較', k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);

      materials.forEach((mat, idx) => {
        let rows = getMaterialRows(mat);
        drawCumulativeLineChart(`sc${idx+5}`, rows, `${mat}累積產值`, k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);
      });
      drawCumulativeLineChart('sc8', getCombinedRowsForActiveMonths(materials, sheet, k23, k24, k25, k26, activeMonths), '合計累積產值', k23, k24, k25, k26, label23, label24, label25, label26, activeMonths);
    }

    function getCombinedRowsForActiveMonths(materials, sheet, k23, k24, k25, k26, activeMonths) {
      let combined = [];
      activeMonths.forEach((m) => {
        let rowObj = { month: m, [k23]: 0, [k24]: 0, [k25]: 0, [k26]: 0 };
        materials.forEach(mat => {
          let mRows = sheet.data.filter(r => {
            let cat = String(r.category || r[sheet.columns[0].key] || '').trim().toLowerCase();
            let mLower = mat.toLowerCase();
            if (mLower === "鎢鉬鉭") return cat.includes("鎢鉬鉭") || cat.includes("鎢鉬鈕");
            if (mLower === "other") return cat.includes("other") || cat.includes("其他");
            return cat.includes(mLower);
          });
          let target = mRows.find(r => String(r.month || r[sheet.columns[1]?.key] || '').trim() === m);
          if (target) {
            rowObj[k23] += parseNum(target[k23]);
            rowObj[k24] += parseNum(target[k24]);
            rowObj[k25] += parseNum(target[k25]);
            rowObj[k26] += parseNum(target[k26]);
          }
        });
        combined.push(rowObj);
      });
      return combined;
    }

    function drawBarComparisonChart(chartId, rows, titleText, k23, k24, k25, k26, l23, l24, l25, l26, activeMonths) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (window.chartInstances[chartId]) window.chartInstances[chartId].destroy();

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: activeMonths,
          datasets: [
            { label: l23, data: activeMonths.map((m) => parseNum(rows.find(r => String(r.month || r.category).trim() === m)?.[k23])), backgroundColor: '#10b981', datalabels: { display: false } },
            { label: l24, data: activeMonths.map((m) => parseNum(rows.find(r => String(r.month || r.category).trim() === m)?.[k24])), backgroundColor: '#3b82f6', datalabels: { display: false } },
            { label: l25, data: activeMonths.map((m) => parseNum(rows.find(r => String(r.month || r.category).trim() === m)?.[k25])), backgroundColor: '#f59e0b', datalabels: { display: false } },
            { 
              label: l26, data: activeMonths.map((m) => parseNum(rows.find(r => String(r.month || r.category).trim() === m)?.[k26])), backgroundColor: '#ef4444',
              datalabels: {
                display: function(context) { return context.dataIndex === activeMonths.length - 1; },
                align: 'end', anchor: 'end',
                formatter: function() { return '📍'; },
                color: '#ef4444', font: { size: 14 }
              }
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' }, title: { display: false } } },
        plugins: [ChartDataLabels]
      });
    }

    function drawCumulativeLineChart(chartId, rows, titleText, k23, k24, k25, k26, l23, l24, l25, l26, activeMonths) {
      const canvas = document.getElementById(`canvas-${chartId}`);
      if (!canvas) return;
      if (!activeMonths || activeMonths.length === 0) return;
      if (window.chartInstances && window.chartInstances[chartId]) {
        window.chartInstances[chartId].destroy();
      }

      let s23 = 0, s24 = 0, s25 = 0, s26 = 0;
      const safeRows = rows || [];
      
      const data23 = activeMonths.map((m, i) => { let r = safeRows.find(x => String(x.month || x.category).trim() === m) || safeRows[i]; s23 += parseNum(r?.[k23]); return s23; });
      const data24 = activeMonths.map((m, i) => { let r = safeRows.find(x => String(x.month || x.category).trim() === m) || safeRows[i]; s24 += parseNum(r?.[k24]); return s24; });
      const data25 = activeMonths.map((m, i) => { let r = safeRows.find(x => String(x.month || x.category).trim() === m) || safeRows[i]; s25 += parseNum(r?.[k25]); return s25; });
      const data26 = activeMonths.map((m, i) => { let r = safeRows.find(x => String(x.month || x.category).trim() === m) || safeRows[i]; s26 += parseNum(r?.[k26]); return s26; });

      const totals = [{ year: l23, val: s23 }, { year: l24, val: s24 }, { year: l25, val: s25 }, { year: l26, val: s26 }];
      totals.sort((a, b) => b.val - a.val);

      const yoyVal = s25 > 0 ? ((s26 - s25) / s25 * 100).toFixed(1) : '0.0';
      const titleEl = document.getElementById(`title-${chartId}`);
      if (titleEl) {
        titleEl.innerHTML = `${titleText} &nbsp;|&nbsp; <span class="text-xs text-blue-600 font-bold">Top1:${totals[0].year}</span> <span class="text-xs text-slate-500">(YoY: ${yoyVal}%)</span>`;
      }

      window.chartInstances[chartId] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: activeMonths,
          datasets: [
            { label: l23, data: data23, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.1, datalabels: { display: false } },
            { label: l24, data: data24, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.1, datalabels: { display: false } },
            { label: l25, data: data25, borderColor: '#f59e0b', backgroundColor: '#f59e0b', tension: 0.1, datalabels: { display: false } },
            { 
              label: l26, data: data26, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.1,
              datalabels: {
                display: function(context) { return context.dataIndex === activeMonths.length - 1; },
                align: 'top', anchor: 'end',
                formatter: function() { return '📍'; },
                color: '#ef4444', font: { size: 14 }
              }
            }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' }, title: { display: false } } },
        plugins: [ChartDataLabels]
      });
    }

    // 4. 一鍵匯出所有工作表功能
    window.exportAllSheetsToExcel = function() {
      try {
        if (typeof XLSX === 'undefined') return alert('SheetJS 尚未載入完成！');
        if (!window.appState || !window.appState.sheets || window.appState.sheets.length === 0) {
          return alert('目前沒有可匯出的工作表資料！');
        }

        const wb = XLSX.utils.book_new();

        window.appState.sheets.forEach(sheet => {
          const headers = (sheet.columns || []).map(c => c.title);
          const rowsData = (sheet.data || []).map(row => {
            const obj = {};
            (sheet.columns || []).forEach(c => {
              obj[c.title] = row[c.key] !== undefined ? row[c.key] : '';
            });
            return obj;
          });

          const ws = XLSX.utils.json_to_sheet(rowsData, { header: headers });
          XLSX.utils.book_append_sheet(wb, ws, sheet.name);
        });

        const todayStr = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `MFG_Analysis_System_${todayStr}.xlsx`);
      } catch (err) {
        console.error(err);
        alert('匯出 Excel 失敗：' + err.message);
      }
    };

    // 5. 一鍵匯入所有相符工作表功能
    window.importAllSheetsFromExcel = async function(event) {
      if (!window.isAuthorizedEditor) { alert("需要管理者權限才能匯入！"); return; }
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          let matchedCount = 0;

          workbook.SheetNames.forEach(sheetName => {
            const targetSheet = window.appState.sheets.find(s => s.name.trim() === sheetName.trim());
            if (targetSheet) {
              const worksheet = workbook.Sheets[sheetName];
              const json = XLSX.utils.sheet_to_json(worksheet);
              
              if (json.length > 0) {
                const keys = Object.keys(json[0]);
                const columns = keys.map((k, idx) => ({
                  key: idx === 0 ? 'category' : (idx === 1 && k.toLowerCase().includes('month') ? 'month' : 'col_' + idx),
                  title: k
                }));

                const sheetData = json.map(row => {
                  let rObj = {};
                  keys.forEach((k, idx) => {
                    rObj[columns[idx].key] = row[k];
                  });
                  return rObj;
                });

                targetSheet.columns = columns;
                targetSheet.data = sheetData;
                matchedCount++;
              }
            }
          });

          if (matchedCount > 0) {
            renderApp();
            autoSaveToFirebase();
            alert(`成功更新 ${matchedCount} 個相符名稱的工作表，圖表已同步更新！`);
          } else {
            alert("Excel 中的工作表名稱與目前系統中的工作表名稱皆不符合！");
          }
        } catch (err) {
          console.error(err);
          alert("解析 Excel 檔案失敗，請確認檔案格式是否正確。");
        }
        event.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    };

    window.exportChartToPNG = function(chartId, title) {
      const element = document.getElementById(`export-area-${chartId}`);
      if (!element) return;
      
      const btn = element.querySelector('.export-btn');
      if (btn) btn.style.display = 'none';

      html2canvas(element, { 
        scale: 3, 
        useCORS: true,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        if (btn) btn.style.display = '';
        const link = document.createElement('a');
        link.download = `${title || 'chart'}.png`;
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
      }).catch((err) => {
        console.error(err);
        if (btn) btn.style.display = '';
        alert("匯出圖片失敗！");
      });
    };
  </script>
